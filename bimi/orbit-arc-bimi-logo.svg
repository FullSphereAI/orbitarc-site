<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     version="1.2"
     baseProfile="tiny-ps"
     width="256"
     height="256"
     viewBox="0 0 256 256">
  <title>Orbit Arc</title>
  <desc>Orbit Arc glowing energy sphere with orbital rings</desc>

  <defs>
    <radialGradient id="space" cx="50%" cy="46%" r="72%">
      <stop offset="0" stop-color="#102b72"/>
      <stop offset="0.42" stop-color="#061238"/>
      <stop offset="1" stop-color="#010208"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#75fbff" stop-opacity="0.76"/>
      <stop offset="0.45" stop-color="#128cff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#28146b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="38%" cy="32%" r="72%">
      <stop offset="0" stop-color="#efffff"/>
      <stop offset="0.12" stop-color="#7efbff"/>
      <stop offset="0.42" stop-color="#138ee7"/>
      <stop offset="0.76" stop-color="#073778"/>
      <stop offset="1" stop-color="#020b2b"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#654cff"/>
      <stop offset="0.25" stop-color="#26d9ff"/>
      <stop offset="0.52" stop-color="#ffffff"/>
      <stop offset="0.76" stop-color="#55a8ff"/>
      <stop offset="1" stop-color="#763eff"/>
    </linearGradient>
    <linearGradient id="energy" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2468ff"/>
      <stop offset="0.48" stop-color="#efffff"/>
      <stop offset="1" stop-color="#8a4dff"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background: remains filled when a mailbox crops to a circle. -->
  <rect width="256" height="256" fill="url(#space)"/>
  <circle cx="128" cy="128" r="126" fill="none" stroke="#162c72" stroke-width="2"/>

  <!-- Stars and deep-space texture. -->
  <circle cx="22" cy="29" r="1.2" fill="#d9f8ff"/>
  <circle cx="44" cy="61" r="0.8" fill="#799cff"/>
  <circle cx="73" cy="22" r="0.9" fill="#ffffff"/>
  <circle cx="102" cy="43" r="1.1" fill="#63dcff"/>
  <circle cx="151" cy="19" r="0.8" fill="#ffffff"/>
  <circle cx="184" cy="46" r="1.1" fill="#9582ff"/>
  <circle cx="225" cy="31" r="0.9" fill="#8eefff"/>
  <circle cx="237" cy="79" r="1.3" fill="#ffffff"/>
  <circle cx="19" cy="101" r="0.9" fill="#738dff"/>
  <circle cx="31" cy="203" r="1.1" fill="#9deeff"/>
  <circle cx="67" cy="229" r="0.8" fill="#ffffff"/>
  <circle cx="103" cy="215" r="1.2" fill="#4caaff"/>
  <circle cx="159" cy="232" r="0.9" fill="#ffffff"/>
  <circle cx="207" cy="218" r="1.1" fill="#8478ff"/>
  <circle cx="237" cy="188" r="0.8" fill="#ffffff"/>

  <!-- Energy rays reach the circular edge so the mark has no empty border. -->
  <path d="M111 79 L50 0" fill="none" stroke="#6655ff" stroke-width="9" stroke-opacity="0.18"/>
  <path d="M116 78 L82 0" fill="none" stroke="#59c9ff" stroke-width="3" stroke-opacity="0.34"/>
  <path d="M146 78 L188 0" fill="none" stroke="#8e55ff" stroke-width="10" stroke-opacity="0.18"/>
  <path d="M151 82 L219 0" fill="none" stroke="#b58cff" stroke-width="3" stroke-opacity="0.38"/>
  <path d="M176 123 L256 83" fill="none" stroke="#6450ff" stroke-width="9" stroke-opacity="0.20"/>
  <path d="M179 132 L256 143" fill="none" stroke="#55dcff" stroke-width="4" stroke-opacity="0.34"/>
  <path d="M80 139 L0 172" fill="none" stroke="#385cff" stroke-width="7" stroke-opacity="0.20"/>
  <path d="M91 170 L48 256" fill="none" stroke="#5d4dff" stroke-width="7" stroke-opacity="0.17"/>
  <path d="M157 170 L207 256" fill="none" stroke="#42cfff" stroke-width="5" stroke-opacity="0.18"/>

  <!-- Large soft halo built with a gradient rather than an SVG filter. -->
  <circle cx="128" cy="126" r="103" fill="url(#halo)"/>

  <!-- Rear orbital bands. -->
  <ellipse cx="128" cy="132" rx="118" ry="48" fill="none" stroke="#462bce" stroke-width="15" stroke-opacity="0.28" transform="rotate(-17 128 132)"/>
  <ellipse cx="128" cy="132" rx="117" ry="46" fill="none" stroke="url(#ring)" stroke-width="7" transform="rotate(-17 128 132)"/>
  <ellipse cx="128" cy="132" rx="112" ry="41" fill="none" stroke="#a2fbff" stroke-width="2" stroke-opacity="0.96" transform="rotate(-17 128 132)"/>
  <ellipse cx="128" cy="132" rx="106" ry="37" fill="none" stroke="#6754ff" stroke-width="2" stroke-opacity="0.82" transform="rotate(-17 128 132)"/>

  <!-- Energy sphere. -->
  <circle cx="128" cy="125" r="77" fill="#168cff" fill-opacity="0.18"/>
  <circle cx="128" cy="125" r="72" fill="url(#planet)" stroke="#a9ffff" stroke-width="4"/>
  <circle cx="128" cy="125" r="65" fill="none" stroke="#58f4ff" stroke-width="1.5" stroke-opacity="0.65"/>

  <!-- Vector energy currents contained inside the sphere. -->
  <path d="M74 105 C89 78 112 78 126 99 C140 121 160 116 180 91" fill="none" stroke="#adffff" stroke-width="2.5" stroke-opacity="0.80"/>
  <path d="M70 129 C90 113 106 117 119 137 C132 157 155 158 183 135" fill="none" stroke="#42eaff" stroke-width="3" stroke-opacity="0.76"/>
  <path d="M82 165 C99 146 113 151 124 171 C139 158 153 145 174 153" fill="none" stroke="#5bf7ff" stroke-width="2" stroke-opacity="0.76"/>
  <path d="M96 64 C112 82 121 101 119 126 C117 150 127 170 151 185" fill="none" stroke="#d5ffff" stroke-width="2" stroke-opacity="0.66"/>
  <path d="M151 68 C137 86 137 103 153 118 C170 134 166 153 150 179" fill="none" stroke="#6aefff" stroke-width="2.5" stroke-opacity="0.72"/>
  <path d="M81 91 C106 97 118 87 129 71 C139 88 154 99 177 101" fill="none" stroke="#4aa9ff" stroke-width="2" stroke-opacity="0.82"/>
  <path d="M79 151 C105 140 129 145 143 167" fill="none" stroke="#a9ffff" stroke-width="1.5" stroke-opacity="0.72"/>
  <circle cx="105" cy="103" r="18" fill="none" stroke="#5deeff" stroke-width="1.3" stroke-opacity="0.48"/>
  <circle cx="149" cy="139" r="22" fill="none" stroke="#75cfff" stroke-width="1.2" stroke-opacity="0.42"/>

  <!-- Bright orbital arc in front of the sphere. -->
  <path d="M25 174 C72 205 159 178 230 112" fill="none" stroke="#3826bf" stroke-width="16" stroke-opacity="0.36"/>
  <path d="M25 171 C73 201 160 175 232 108" fill="none" stroke="url(#energy)" stroke-width="8"/>
  <path d="M27 169 C75 196 159 171 228 109" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.96"/>

  <!-- Three signature energy points. -->
  <circle cx="105" cy="101" r="9" fill="#ffffff" fill-opacity="0.92"/>
  <circle cx="168" cy="91" r="6" fill="#ffffff" fill-opacity="0.90"/>
  <circle cx="168" cy="142" r="7" fill="#ffffff" fill-opacity="0.92"/>
  <path d="M105 78 L105 124 M82 101 L128 101 M89 85 L121 117 M121 85 L89 117" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.88"/>
  <path d="M168 75 L168 107 M152 91 L184 91" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.86"/>
  <path d="M168 124 L168 160 M150 142 L186 142" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.88"/>
</svg>
